<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TermoBR - Missão Espacial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep-space: #070913;
      --panel-bg: rgba(15, 20, 42, 0.75);
      --panel-border: rgba(0, 240, 255, 0.25);
      --tile-empty: rgba(13, 19, 39, 0.6);
      --tile-border: #1e2952;
      --tile-border-filled: #00f0ff;
      --neon-cyan: #00f0ff;
      --neon-magenta: #ff007f;
      --neon-purple: #9d4edd;
      --correct: #00ff88;
      --correct-glow: rgba(0, 255, 136, 0.45);
      --present: #ffd000;
      --present-glow: rgba(255, 208, 0, 0.45);
      --absent-bg: #151b33;
      --absent-border: #252d4d;
      --absent-text: #59658a;
      --text-main: #e2e8f0;
      --key-bg: rgba(23, 32, 65, 0.85);
      --key-border: rgba(90, 110, 180, 0.35);
      --key-glow: rgba(0, 240, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-deep-space);
      background-image: 
        radial-gradient(circle at 20% 15%, rgba(157, 78, 221, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(255, 0, 127, 0.08) 0%, transparent 60%);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
      user-select: none;
    }

    #space-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
    }

    header {
      width: 100%;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.1), inset 0 0 15px rgba(0, 240, 255, 0.05);
      margin-bottom: 6px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .logo-badge {
      display: flex;
      align-items: center;
    }

    .logo-badge h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--neon-cyan), #fff, var(--neon-magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
    }

    .space-btn {
      border: 1px solid var(--panel-border);
      background: rgba(20, 28, 58, 0.85);
      color: var(--neon-cyan);
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      border-radius: 12px;
      padding: 7px 10px;
      font-size: 0.78rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
      transition: all 0.2s ease;
    }

    .space-btn:active {
      transform: scale(0.95);
      background: rgba(0, 240, 255, 0.2);
    }

    .btn-hint {
      color: var(--present) !important;
      border-color: rgba(255, 208, 0, 0.6) !important;
      background: rgba(35, 30, 15, 0.85) !important;
      box-shadow: 0 0 12px rgba(255, 208, 0, 0.3) !important;
    }

    .btn-audio {
      min-width: 68px;
    }

    .btn-audio.active {
      color: var(--correct);
      border-color: rgba(0, 255, 136, 0.4);
      box-shadow: 0 0 12px var(--correct-glow);
    }

    .btn-new {
      border-color: rgba(255, 0, 127, 0.4);
      color: var(--neon-magenta);
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.2);
    }

    #hint-banner {
      width: 100%;
      background: rgba(255, 208, 0, 0.12);
      border: 1px dashed rgba(255, 208, 0, 0.6);
      border-radius: 12px;
      padding: 8px 12px;
      color: var(--present);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      text-align: center;
      letter-spacing: 1.5px;
      display: none;
      animation: popQuantum 0.3s ease;
      margin-bottom: 4px;
      text-shadow: 0 0 8px rgba(255, 208, 0, 0.5);
      box-shadow: 0 0 15px rgba(255, 208, 0, 0.15);
    }

    #game-container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      width: 100%;
      padding: 4px 0;
    }

    #board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      grid-gap: 8px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-gap: 8px;
    }

    .tile {
      width: 58px;
      height: 58px;
      background: var(--tile-empty);
      border: 2px solid var(--tile-border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.9rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      perspective: 1000px;
      transform-style: preserve-3d;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    @media (max-height: 720px) {
      .tile {
        width: 50px;
        height: 50px;
        font-size: 1.6rem;
      }
    }

    @media (max-width: 360px) {
      .tile {
        width: 44px;
        height: 44px;
        font-size: 1.4rem;
      }
    }

    .tile[data-state="filled"] {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.35), inset 0 0 8px rgba(0, 240, 255, 0.2);
      animation: popQuantum 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .tile.flip {
      animation: spaceFlip 0.7s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
    }

    .tile[data-state="correct"] {
      background: linear-gradient(135deg, #00b359, var(--correct));
      border-color: var(--correct);
      box-shadow: 0 0 20px var(--correct-glow), inset 0 0 10px rgba(255, 255, 255, 0.3);
      color: #05140b;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
    }

    .tile[data-state="present"] {
      background: linear-gradient(135deg, #cc9900, var(--present));
      border-color: var(--present);
      box-shadow: 0 0 20px var(--present-glow), inset 0 0 10px rgba(255, 255, 255, 0.3);
      color: #1a1400;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
    }

    .tile[data-state="absent"] {
      background: var(--absent-bg);
      border-color: var(--absent-border);
      color: var(--absent-text);
      box-shadow: none;
    }

    .row.shake { animation: warpShake 0.5s ease-in-out; }
    .row.bounce-win .tile { animation: pulseVictory 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) alternate 2; }

    #keyboard {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 4px 4px 10px;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 5px;
      touch-action: manipulation;
    }

    .key {
      background: var(--key-bg);
      border: 1px solid var(--key-border);
      border-radius: 10px;
      color: #e2e8f0;
      height: 50px;
      flex: 1;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4), 0 0 8px var(--key-glow);
      transition: all 0.1s ease;
    }

    .key:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
      background: rgba(0, 240, 255, 0.25);
    }

    .key.wide {
      flex: 1.55;
      font-size: 0.85rem;
      color: var(--neon-cyan);
      border-color: rgba(0, 240, 255, 0.4);
    }

    .key[data-state="correct"] {
      background: var(--correct);
      border-color: var(--correct);
      color: #05140b;
      box-shadow: 0 0 12px var(--correct-glow);
    }
    .key[data-state="present"] {
      background: var(--present);
      border-color: var(--present);
      color: #1a1400;
      box-shadow: 0 0 12px var(--present-glow);
    }
    .key[data-state="absent"] {
      background: var(--absent-bg);
      border-color: var(--absent-border);
      color: var(--absent-text);
      box-shadow: none;
    }

    #toast-container {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 2000;
      pointer-events: none;
    }

    .toast {
      background: rgba(10, 16, 35, 0.95);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: 'Orbitron', sans-serif;
      padding: 10px 22px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 1px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.2);
      animation: spaceToast 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      text-align: center;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 7, 18, 0.85);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: rgba(15, 22, 48, 0.95);
      border: 1px solid var(--neon-cyan);
      border-radius: 24px;
      padding: 28px 24px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(0, 240, 255, 0.1);
      position: relative;
      transform: scale(0.9);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-card { transform: scale(1); }

    .modal-close {
      position: absolute;
      top: 14px; right: 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 34px; height: 34px;
      border-radius: 50%;
      color: var(--neon-cyan);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-card h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 20px 0;
    }

    .stat-pill {
      background: rgba(20, 28, 60, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 14px;
      padding: 10px 4px;
    }

    .stat-pill .num {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .stat-pill .label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .secret-reveal {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--present);
      background: rgba(255, 208, 0, 0.1);
      border: 1px dashed var(--present);
      border-radius: 14px;
      padding: 12px;
      margin: 14px 0 18px;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-shadow: 0 0 10px rgba(255, 208, 0, 0.5);
    }

    .modal-play-btn {
      width: 100%;
      background: linear-gradient(90deg, #00d2ff, #00f0ff);
      color: #070913;
      border: none;
      padding: 14px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
      transition: all 0.2s ease;
    }
    .modal-play-btn:active {
      transform: scale(0.96);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }

    @keyframes popQuantum {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes spaceFlip {
      0% { transform: rotateX(0deg); }
      45% { transform: rotateX(90deg); }
      55% { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); }
    }

    @keyframes warpShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    @keyframes pulseVictory {
      0% { transform: translateY(0); filter: brightness(1); }
      100% { transform: translateY(-12px); filter: brightness(1.3); }
    }

    @keyframes spaceToast {
      0% { opacity: 0; transform: translateY(-16px) scale(0.9); }
      12% { opacity: 1; transform: translateY(0) scale(1); }
      85% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-14px) scale(0.95); }
    }

    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 2500;
    }
  </style>
</head>
<body>

  <canvas id="space-canvas"></canvas>
  <canvas id="confetti-canvas"></canvas>

  <div class="app-shell">
    <header>
      <div class="header-actions">
        <button class="space-btn btn-stats" onclick="abrirEstatisticas()">DADOS</button>
        <button class="space-btn btn-hint" onclick="revelarDica()">DICA</button>
        <button id="audio-toggle-btn" class="space-btn btn-audio" onclick="alternarSom()">SOM: OFF</button>
      </div>
      <div class="logo-badge">
        <h1>TERMOBR</h1>
      </div>
      <button class="space-btn btn-new" onclick="iniciarJogo()">REINICIAR</button>
    </header>

    <div id="hint-banner"></div>
    <div id="toast-container"></div>

    <div id="game-container">
      <div id="board"></div>
    </div>

    <div id="keyboard"></div>
  </div>

  <div id="stats-modal" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="fecharEstatisticas()">&times;</button>
      <h2>RELATÓRIO DE MISSÃO</h2>
      
      <div class="stats-grid">
        <div class="stat-pill">
          <div class="num" id="stat-jogos">0</div>
          <div class="label">Missões</div>
        </div>
        <div class="stat-pill">
          <div class="num" id="stat-vitorias">0%</div>
          <div class="label">Sucesso</div>
        </div>
        <div class="stat-pill">
          <div class="num" id="stat-streak">0</div>
          <div class="label">Combo</div>
        </div>
        <div class="stat-pill">
          <div class="num" id="stat-max-streak">0</div>
          <div class="label">Recorde</div>
        </div>
      </div>

      <div id="secret-box" class="secret-reveal" style="display: none;"></div>

      <button class="modal-play-btn" onclick="fecharEstatisticas(); iniciarJogo();">NOVA EXPEDIÇÃO</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let isAudioOn = false;
    let masterGain = null;
    let sfxGain = null;
    let bgTimer = null;
    let seqStep = 0;

    const BASS_PITCHES = [
      110, 110, 130.81, 110, 146.83, 130.81, 110, 164.81,
      110, 110, 130.81, 110, 98, 110, 123.47, 130.81
    ];
    const ARP_PITCHES = [
      440, 523.25, 659.25, 880, 587.33, 659.25, 880, 1046.50
    ];

    function initAudio() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
      masterGain.connect(audioCtx.destination);

      sfxGain = audioCtx.createGain();
      sfxGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
      sfxGain.connect(audioCtx.destination);
    }

    function triggerBassPulse(freq) {
      if (!isAudioOn || !audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, now);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(700, now);
      filter.frequency.exponentialRampToValueAtTime(140, now + 0.16);

      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);

      osc.start(now);
      osc.stop(now + 0.18);
    }

    function triggerArpPulse(freq) {
      if (!isAudioOn || !audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

      osc.connect(gain);
      gain.connect(masterGain);

      osc.start(now);
      osc.stop(now + 0.23);
    }

    function loopSequencer() {
      if (!isAudioOn) return;
      const bassNote = BASS_PITCHES[seqStep % BASS_PITCHES.length];
      const arpNote = ARP_PITCHES[seqStep % ARP_PITCHES.length];

      triggerBassPulse(bassNote);
      if (seqStep % 2 === 0) {
        triggerArpPulse(arpNote);
      }

      seqStep++;
      bgTimer = setTimeout(loopSequencer, 155);
    }

    function alternarSom() {
      const btn = document.getElementById("audio-toggle-btn");
      if (!audioCtx) initAudio();

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      isAudioOn = !isAudioOn;

      if (isAudioOn) {
        masterGain.gain.setTargetAtTime(0.65, audioCtx.currentTime, 0.5);
        btn.textContent = "SOM: ON";
        btn.classList.add("active");
        mostrarToast("TRANSMISSÃO SONORA ATIVA");
        clearTimeout(bgTimer);
        loopSequencer();
      } else {
        masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.4);
        btn.textContent = "SOM: OFF";
        btn.classList.remove("active");
        clearTimeout(bgTimer);
      }
    }

    // ================= SFX INTERATIVOS ================= //

    function playTypeSound(letterIdx = 0) {
      if (!audioCtx) initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        const baseFreq = 580 + (letterIdx * 90);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.8, now + 0.05);

        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

        osc.connect(gain);
        gain.connect(sfxGain);

        osc.start(now);
        osc.stop(now + 0.07);
      } catch (e) {}
    }

    function playDeleteSound() {
      if (!audioCtx) initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(gain);
        gain.connect(sfxGain);

        osc.start(now);
        osc.stop(now + 0.1);
      } catch (e) {}
    }

    function resizeSpace() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
      stars = [];
      for (let i = 0; i < 110; i++) {
        stars.push({
          x: Math.random() * bgCanvas.width,
          y: Math.random() * bgCanvas.height,
          size: Math.random() * 2 + 0.5,
          alpha: Math.random(),
          speed: Math.random() * 0.02 + 0.005
        });
      }
    }

    function animateSpace() {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      stars.forEach(s => {
        s.alpha += s.speed;
        const currentAlpha = Math.abs(Math.sin(s.alpha));
        bgCtx.fillStyle = `rgba(255, 255, 255, ${currentAlpha * 0.85})`;
        bgCtx.beginPath();
        bgCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        bgCtx.fill();
      });
      requestAnimationFrame(animateSpace);
    }

    const TAMANHO = 5;

    let letraAtual = 0;

    // Estatísticas Persistentes
    let stats = JSON.parse(localStorage.getItem("termobr_stats")) || {
      jogos: 0,
      vitorias: 0,
      streak: 0,
      maxStreak: 0
    };

    // Histórico de Palavras Já Jogadas (Evita repetições)
    let playedWords = JSON.parse(localStorage.getItem("termobr_played_words")) || [];

    function salvarStats() {
      localStorage.setItem("termobr_stats", JSON.stringify(stats));
    }

    function salvarPalavraJogada(palavra) {
      if (!playedWords.includes(palavra)) {
        playedWords.push(palavra);
        localStorage.setItem("termobr_played_words", JSON.stringify(playedWords));
      }
    }

    function normalizar(texto) {
      return texto.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();
    }

    function mostrarToast(msg) {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2400);
    }

    function revelarDica() {
      if (gameOver) return;
      const banner = document.getElementById("hint-banner");
      banner.textContent = `DICA DE TELEMETRIA: ${dicaAtual}`;
      banner.style.display = "block";
      playHintSound();
      mostrarToast(`DICA REVELADA: ${dicaAtual}`);
    }

    function montarTeclado() {
      const layout = [
        ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
        ["A", "S", "D", "F", "G", "H", "J", "K", "L", "Ç"],
        ["ENVIAR", "Z", "X", "C", "V", "B", "N", "M", "⌫"]
      ];

      const kb = document.getElementById("keyboard");
      kb.innerHTML = "";

      layout.forEach(linha => {
        const rowDiv = document.createElement("div");
        rowDiv.className = "kb-row";

        linha.forEach(tecla => {
          const btn = document.createElement("button");
          btn.className = "key";
          btn.textContent = tecla;
          btn.id = `key-${tecla}`;

          if (tecla === "ENVIAR" || tecla === "⌫") {
            btn.classList.add("wide");
          }

          btn.addEventListener("click", () => {
            if (tecla === "ENVIAR") tratarEntrada("ENTER");
            else tratarEntrada(tecla);
          });
          rowDiv.appendChild(btn);
        });
        kb.appendChild(rowDiv);
      });
    }

    function iniciarJogo() {
      // Filtrar apenas palavras que o usuário AINDA NÃO jogou
      let disponiveis = PALAVRAS_SECRETAS.filter(item => !playedWords.includes(normalizar(item.palavra)));

      // Caso tenha zerado todas as 2.400+ palavras, reseta o histórico automaticamente
      if (disponiveis.length === 0) {
        playedWords = [];
        localStorage.setItem("termobr_played_words", JSON.stringify([]));
        disponiveis = PALAVRAS_SECRETAS;
        mostrarToast("BANCO DE PALAVRAS REINICIADO!");
      }

      // Sorteia aleatoriamente entre as palavras não jogadas
      const index = Math.floor(Math.random() * disponiveis.length);
      const item = disponiveis[index];
      segredo = normalizar(item.palavra);
      dicaAtual = item.dica;
      
      tentativaAtual = 0;
      letraAtual = 0;
      gameOver = false;
      grid = Array(MAX_TENTATIVAS).fill("").map(() => Array(TAMANHO).fill(""));

      document.getElementById("hint-banner").style.display = "none";
      document.getElementById("hint-banner").textContent = "";

      const board = document.getElementById("board");
      board.innerHTML = "";

      for (let r = 0; r < MAX_TENTATIVAS; r++) {
        const row = document.createElement("div");
        row.className = "row";
        row.id = `row-${r}`;
        for (let c = 0; c < TAMANHO; c++) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `tile-${r}-${c}`;
          row.appendChild(tile);
        }
        board.appendChild(row);
      }

      montarTeclado();
      document.getElementById("secret-box").style.display = "none";
    }

    function tratarEntrada(key) {
      if (gameOver) return;

      if (key === "ENTER") {
        validarTentativa();
      } else if (key === "⌫" || key === "BACKSPACE") {
        apagarLetra();
      } else if (/^[A-ZÇ]$/i.test(key) && key.length === 1) {
        inserirLetra(normalizar(key));
      }
    }

    function inserirLetra(letra) {
      if (letraAtual < TAMANHO) {
        grid[tentativaAtual][letraAtual] = letra;
        const tile = document.getElementById(`tile-${tentativaAtual}-${letraAtual}`);
        tile.textContent = letra;
        tile.setAttribute("data-state", "filled");
        playTypeSound(letraAtual);
        letraAtual++;
      }
    }

    function apagarLetra() {
      if (letraAtual > 0) {
        letraAtual--;
        grid[tentativaAtual][letraAtual] = "";
        const tile = document.getElementById(`tile-${tentativaAtual}-${letraAtual}`);
        tile.textContent = "";
        tile.removeAttribute("data-state");
        playDeleteSound();
      }
    }

    function shakeRow(rowIdx) {
      const row = document.getElementById(`row-${rowIdx}`);
      row.classList.add("shake");
      setTimeout(() => row.classList.remove("shake"), 500);
    }

    function validarTentativa() {
      if (letraAtual < TAMANHO) {
        mostrarToast("TELEMETRIA INCOMPLETA");
        shakeRow(tentativaAtual);
        playDeleteSound();
        return;
      }

      const tentativa = grid[tentativaAtual].join("");

      // Verificação rigorosa no Dicionário Brasileiro
      if (!DICIONARIO.includes(tentativa)) {
        mostrarToast("PALAVRA NÃO RECONHECIDA NO DICIONÁRIO");
        shakeRow(tentativaAtual);
        playErrorBuzzer();
        return;
      }

      playScanSound();

      const segredoArr = segredo.split("");
      const resultado = Array(TAMANHO).fill("absent");
      const contagem = {};

      for (const char of segredo) {
        contagem[char] = (contagem[char] || 0) + 1;
      }

      for (let i = 0; i < TAMANHO; i++) {
        if (tentativa[i] === segredoArr[i]) {
          resultado[i] = "correct";
          contagem[tentativa[i]]--;
        }
      }

      for (let i = 0; i < TAMANHO; i++) {
        if (resultado[i] !== "correct" && contagem[tentativa[i]] > 0) {
          resultado[i] = "present";
          contagem[tentativa[i]]--;
        }
      }

      const tempoFlip = 700;
      const intervaloLetras = 240;

      for (let i = 0; i < TAMANHO; i++) {
        const tile = document.getElementById(`tile-${tentativaAtual}-${i}`);
        const status = resultado[i];
        
        setTimeout(() => {
          tile.classList.add("flip");
          
          setTimeout(() => {
            tile.setAttribute("data-state", status);
            playRevealSound(status, i);

            const keyEl = document.getElementById(`key-${tentativa[i]}`);
            if (keyEl) {
              const cur = keyEl.getAttribute("data-state");
              if (status === "correct" || (status === "present" && cur !== "correct") || (!cur && status === "absent")) {
                keyEl.setAttribute("data-state", status);
              }
            }
          }, tempoFlip * 0.48);

        }, i * intervaloLetras);
      }

      const delayTermino = (TAMANHO - 1) * intervaloLetras + tempoFlip + 80;

      setTimeout(() => {
        if (tentativa === segredo) {
          mostrarToast("MISSÃO CUMPRIDA");
          const curRow = document.getElementById(`row-${tentativaAtual}`);
          curRow.classList.add("bounce-win");
          soltarParticulasEspaciais();
          playVictoryChime();
          gameOver = true;
          salvarPalavraJogada(segredo);
          atualizarEstatisticas(true);
          setTimeout(abrirEstatisticas, 2000);
          return;
        }

        if (tentativaAtual === MAX_TENTATIVAS - 1) {
          mostrarToast(`SINAL PERDIDO: ${segredo}`);
          playDefeatSound();
          gameOver = true;
          salvarPalavraJogada(segredo);
          atualizarEstatisticas(false);
          const secretBox = document.getElementById("secret-box");
          secretBox.innerHTML = `<span>PALAVRA-CHAVE: <b>${segredo}</b></span><small style="color: #94a3b8; margin-top: 4px;">CATEGORIA: ${dicaAtual}</small>`;
          secretBox.style.display = "flex";
          setTimeout(abrirEstatisticas, 1800);
          return;
        }

        tentativaAtual++;
        letraAtual = 0;
      }, delayTermino);
    }

    function atualizarEstatisticas(venceu) {
      stats.jogos++;
      if (venceu) {
        stats.vitorias++;
        stats.streak++;
        if (stats.streak > stats.maxStreak) stats.maxStreak = stats.streak;
      } else {
        stats.streak = 0;
      }
      salvarStats();
    }

    function abrirEstatisticas() {
      document.getElementById("stat-jogos").textContent = stats.jogos;
      const winRate = stats.jogos > 0 ? Math.round((stats.vitorias / stats.jogos) * 100) : 0;
      document.getElementById("stat-vitorias").textContent = `${winRate}%`;
      document.getElementById("stat-streak").textContent = stats.streak;
      document.getElementById("stat-max-streak").textContent = stats.maxStreak;
      document.getElementById("stats-modal").classList.add("active");
    }

    function fecharEstatisticas() {
      document.getElementById("stats-modal").classList.remove("active");
    }

    function soltarParticulasEspaciais() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const cores = ["#00f0ff", "#ff007f", "#9d4edd", "#00ff88", "#ffd000", "#ffffff"];

      for (let i = 0; i < 120; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 3;
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3 + 1.5,
          color: cores[Math.floor(Math.random() * cores.length)],
          alpha: 1,
          decay: Math.random() * 0.015 + 0.008
        });
      }

      let animId;

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= p.decay;

          if (p.alpha > 0) {
            active = true;
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.shadowBlur = 10;
            ctx.shadowColor = p.color;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        });

        if (active) {
          animId = requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          cancelAnimationFrame(animId);
        }
      }

      render();
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        tratarEntrada("ENTER");
      } else if (e.key === "Backspace") {
        tratarEntrada("BACKSPACE");
      } else if (/^[a-zA-ZçÇ]$/.test(e.key)) {
        tratarEntrada(e.key.toUpperCase());
      }
    });

    iniciarJogo();
  </script>
